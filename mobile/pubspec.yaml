name: psycho_chat
description: Simple Flutter WebSocket chat client for ws://localhost:3000.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  dio: ^5.9.0
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^2.6.1
  flutter_local_notifications: ^22.0.0
  connectivity_plus: ^7.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
